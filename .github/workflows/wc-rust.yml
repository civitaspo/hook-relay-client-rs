# Rust checks on macOS and Linux, the platforms releases ship binaries for.

name: rust (workflow_call)

on:
  workflow_call:

permissions: {}

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: "2026.10.2"
          install_args: "--locked"
          cache: false

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Build
        run: cargo build --workspace --locked

      - name: Test
        run: mise run test

      # Releases ship static musl binaries for Linux; build one to catch
      # dependencies that do not build for musl before a release does.
      - name: Build the static Linux binary
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          rustup target add x86_64-unknown-linux-musl
          CC_x86_64_unknown_linux_musl=musl-gcc cargo build --locked --target x86_64-unknown-linux-musl
