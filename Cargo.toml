[package]
name = "hook-relay-client"
# Releases do not bump this; the binary reports `.release-version` (see build.rs).
version = "0.0.0"
edition = "2024"
license = "MIT"
description = "A Rust implementation of the hook-relay client"
repository = "https://github.com/civitaspo/hook-relay-client-rs"
publish = false

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "json"] }
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
futures-util = "0.3.34"
hex = "0.4.3"
hmac = "0.13.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal", "net", "time", "sync"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json"] }
url = "2.5.8"
uuid = { version = "1.26.1", features = ["v4"] }

[profile.release]
strip = true
